<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WebAccess 告警顯示</title>
<link rel="stylesheet" href="/typography.css">
<link rel="stylesheet" href="/alarm-icons.css">
<link rel="stylesheet" href="/marquee.css">
<style>
body { margin: 0; background: #101923; color: #fff; font: 2rem var(--app-font); }
main { padding: 4vw; }
body.alarm-active { overflow: hidden; }
body.alarm-active main {
  box-sizing: border-box;
  height: 100vh;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: clamp(8px, 2vh, 22px);
  padding: clamp(12px, 2.5vmin, 32px);
  text-align: center;
}
body.alarm-active #title { width: 100%; margin: 0; flex: none; line-height: 1.2; white-space: nowrap; }
body.alarm-active #status { margin: 0; flex: none; font-size: clamp(.75rem, 2.5vmin, 1.25rem); }
body.alarm-active #status:empty { display: none; }
body.alarm-active #plan-frame { flex: none; }
img { max-width: 100%; max-height: 75vh; object-fit: contain; }
p { color: #ffc47a; }
#title { overflow-wrap: anywhere; white-space: pre-wrap; }
[hidden] { display: none !important; }
#standby { position: fixed; inset: 0; background: #000; }
#standby img, #standby video { width: 100%; height: 100%; max-height: none; object-fit: contain; }
#marquee { position: fixed; }
#status { position: relative; }
#play-alarm-sound {
  position: fixed; top: .75rem; right: .75rem; z-index: 1;
  padding: .5rem .75rem; border: 1px solid #cbd6e4; border-radius: .4rem;
  background: #101923; color: #fff; font: 1rem var(--app-font); cursor: pointer;
}
#plan-frame { display: inline-block; position: relative; max-width: 100%; }
#plan { display: block; background-color: #fff; }
body.alarm-active #plan { max-height: none; }
#marker { position: absolute; transform: translate(-50%, -50%); }
body.image-only #plan-frame { position: fixed; inset: 0; background: #000; }
body.image-only #plan { width: 100%; height: 100%; max-height: none; object-fit: contain; }
body.image-only #title, body.image-only #status { display: none; }
</style>
<main>
  <h1 id="title">正在取得顯示狀態</h1>
  <div id="plan-frame" hidden><img id="plan" alt="測點平面圖"><span class="alarm-icon" id="marker" hidden><img id="marker-image" alt="" hidden></span></div>
  <div id="standby" hidden></div>
  <div class="marquee" id="marquee" hidden><span></span></div>
  <button id="play-alarm-sound" type="button" hidden>播放警報提示音</button>
  <p id="status" role="status"></p>
</main>
<script src="/marquee.js"></script>
<script>
const title = document.getElementById('title');
const main = document.querySelector('main');
const plan = document.getElementById('plan');
const frame = document.getElementById('plan-frame');
const marker = document.getElementById('marker');
const markerImage = document.getElementById('marker-image');
const status = document.getElementById('status');
const standby = document.getElementById('standby');
const renderMarquee = createMarqueeRenderer(document.getElementById('marquee'));
const alarmAudio = new Audio();
const playAlarmSoundButton = document.getElementById('play-alarm-sound');
let activeSound = null;
let soundAttempt = 0;
const preview = new URLSearchParams(location.search).get('preview') === 'idle';
let revision = null;
let playlist = null;
let timer = null;
let alarmTextSize = 48;
let fitRequest = 0;
function scheduleAlarmFit() {
  if (fitRequest) return;
  fitRequest = requestAnimationFrame(() => {
    fitRequest = 0;
    if (!document.body.classList.contains('alarm-active') || document.body.classList.contains('image-only')) {
      title.style.fontSize = '';
      plan.style.width = '';
      plan.style.height = '';
      return;
    }
    const layout = getComputedStyle(main);
    const availableWidth = main.clientWidth - parseFloat(layout.paddingLeft) - parseFloat(layout.paddingRight);
    const availableHeight = main.clientHeight - parseFloat(layout.paddingTop) - parseFloat(layout.paddingBottom);
    const gap = parseFloat(layout.rowGap);
    const statusHeight = status.offsetHeight;
    const maxTitleHeight = Math.max(1, (availableHeight - statusHeight) / 3);
    function fits(size) {
      title.style.fontSize = size + 'px';
      return title.scrollWidth <= title.clientWidth && title.offsetHeight <= maxTitleHeight;
    }
    if (!fits(alarmTextSize)) {
      let lower = .1;
      let upper = alarmTextSize;
      for (let step = 0; step < 12; step++) {
        const candidate = (lower + upper) / 2;
        if (fits(candidate)) lower = candidate;
        else upper = candidate;
      }
      title.style.fontSize = lower + 'px';
    }
    if (frame.hidden || !plan.naturalWidth || !plan.naturalHeight) return;
    const imageHeight = availableHeight - title.offsetHeight - statusHeight - gap * (statusHeight ? 2 : 1);
    const scale = Math.min(1, availableWidth / plan.naturalWidth, imageHeight / plan.naturalHeight);
    plan.style.width = Math.max(1, Math.floor(plan.naturalWidth * scale)) + 'px';
    plan.style.height = Math.max(1, Math.floor(plan.naturalHeight * scale)) + 'px';
  });
}
function showStatus(text) {
  if (status.textContent === text) return;
  status.textContent = text;
  scheduleAlarmFit();
}
window.addEventListener('resize', scheduleAlarmFit);
plan.addEventListener('load', scheduleAlarmFit);
if (document.fonts) document.fonts.ready.then(scheduleAlarmFit);
function play(index) {
  const item = playlist.items[index];
  const element = document.createElement(item.isVideo ? 'video' : 'img');
  const next = () => {
    if (standby.firstChild === element) play((index + 1) % playlist.items.length);
  };
  if (item.isVideo) {
    element.autoplay = true;
    element.playsInline = true;
    element.muted = playlist.isMuted;
    element.loop = playlist.items.length === 1;
    element.onended = next;
  } else {
    element.alt = item.name;
  }
  element.onerror = () => {
    clearTimeout(timer);
    timer = setTimeout(next, 3000);
  };
  standby.replaceChildren(element);
  element.src = '/media/' + encodeURIComponent(item.file);
  if (!item.isVideo && playlist.items.length > 1) timer = setTimeout(next, item.seconds * 1000);
}
function setStandby(next) {
  const nextRevision = next ? next.revision : null;
  if (revision === nextRevision) return;
  revision = nextRevision;
  playlist = next;
  clearTimeout(timer);
  standby.replaceChildren();
  standby.hidden = !next || !next.items.length;
  renderMarquee(next);
  if (!standby.hidden) play(0);
}
async function playAlarmSound() {
  const attempt = ++soundAttempt;
  try {
    await alarmAudio.play();
    if (attempt === soundAttempt) playAlarmSoundButton.hidden = true;
  } catch (error) {
    if (attempt === soundAttempt) playAlarmSoundButton.hidden = error.name !== 'NotAllowedError';
  }
}
playAlarmSoundButton.addEventListener('click', playAlarmSound);
function updateAlarmSound(alarm, appearance) {
  const tone = alarm && appearance?.alarmSoundEnabled ? appearance.alarmTone : null;
  const source = tone === 'custom' ? appearance.alarmSoundUrl : tone ? '/alarm-sounds/' + encodeURIComponent(tone) + '.wav' : null;
  const nextSound = source ? JSON.stringify([alarm.point, source]) : null;
  if (source) alarmAudio.volume = appearance.alarmVolume / 100;
  if (activeSound === nextSound) return;

  activeSound = nextSound;
  soundAttempt++;
  alarmAudio.pause();
  playAlarmSoundButton.hidden = true;
  if (source) {
    alarmAudio.src = source;
    playAlarmSound();
  }
}
async function refresh() {
  try {
    const response = await fetch('/api/display', { cache: 'no-store' });
    if (!response.ok) throw new Error();
    const state = await response.json();
    const alarm = preview ? null : state.alarm;
    setStandby(alarm ? null : state.playlist);
    const url = alarm && alarm.floorPlanUrl;
    const appearance = state.marker;
    const titleText = alarm ? (alarm.description || alarm.point) : '待機中';
    const nextTextSize = appearance?.alarmTextSize || 48;
    const imageOnly = !!(url && appearance && appearance.imageOnly);
    const fitChanged = document.body.classList.contains('alarm-active') !== !!alarm ||
      document.body.classList.contains('image-only') !== imageOnly ||
      title.textContent !== titleText || alarmTextSize !== nextTextSize || frame.hidden !== !url ||
      (!!url && plan.getAttribute('src') !== url);
    document.body.classList.toggle('alarm-active', !!alarm);
    if (title.textContent !== titleText) title.textContent = titleText;
    alarmTextSize = nextTextSize;
    document.body.classList.toggle('image-only', imageOnly);
    frame.hidden = !url;
    if (url && plan.getAttribute('src') !== url) plan.src = url;
    marker.hidden = !url || !appearance || imageOnly;
    frame.classList.toggle('alarm-frame', !marker.hidden);
    if (!marker.hidden) {
      marker.style.left = appearance.x + '%';
      marker.style.top = appearance.y + '%';
      marker.style.setProperty('--icon-size', appearance.iconSize + 'px');
      marker.dataset.icon = appearance.icon || 'sos';
      marker.dataset.flash = appearance.flash;
      const iconUrl = appearance.icon === 'custom' && appearance.iconUrl;
      markerImage.hidden = !iconUrl;
      if (iconUrl && markerImage.getAttribute('src') !== iconUrl) markerImage.src = iconUrl;
    }
    updateAlarmSound(alarm, appearance);
    const lastSuccess = state.lastSuccessAt ? '，最後更新 ' + new Date(state.lastSuccessAt).toLocaleString('zh-TW') : '';
    const messages = { disconnected: 'WebAccess 連線異常' + lastSuccess, connecting: '正在連線至 WebAccess', unconfigured: '尚未設定 WebAccess' };
    showStatus(preview ? '' : messages[state.connectionStatus] || '');
    if (fitChanged) scheduleAlarmFit();
  } catch {
    showStatus('顯示服務連線中斷');
  } finally {
    setTimeout(refresh, 2000);
  }
}
refresh();
</script>
</html>
