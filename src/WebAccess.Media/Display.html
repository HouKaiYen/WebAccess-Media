<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WebAccess 告警顯示</title>
<style>
body { margin: 0; background: #101923; color: #fff; font: 2rem system-ui, sans-serif; }
main { padding: 4vw; }
img { max-width: 100%; max-height: 75vh; object-fit: contain; }
p { color: #ffc47a; }
</style>
<main>
  <h1 id="title">正在取得顯示狀態</h1>
  <img id="plan" alt="測點平面圖" hidden>
  <p id="status" role="status"></p>
</main>
<script>
const title = document.getElementById('title');
const plan = document.getElementById('plan');
const status = document.getElementById('status');
async function refresh() {
  try {
    const response = await fetch('/api/display', { cache: 'no-store' });
    if (!response.ok) throw new Error();
    const state = await response.json();
    title.textContent = state.alarm ? '告警　' + state.alarm.point : '待機中';
    const url = state.alarm && state.alarm.floorPlanUrl;
    plan.hidden = !url;
    if (url && plan.getAttribute('src') !== url) plan.src = url;
    status.textContent = '';
  } catch {
    status.textContent = '顯示服務連線中斷';
  } finally {
    setTimeout(refresh, 2000);
  }
}
refresh();
</script>
</html>
